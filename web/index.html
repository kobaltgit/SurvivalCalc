<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SurvivalCalc — 100% офлайн калькулятор походного рациона, БЖУ и чек-листа снаряжения для туристов и выживальщиков.">
  <meta name="theme-color" content="#0F1216">

  <!-- Open Graph -->
  <meta property="og:title" content="SurvivalCalc — Походный калькулятор">
  <meta property="og:description" content="Офлайн-расчет калорий, БЖУ, продуктовой раскладки и снаряжения. Синхронизация по QR без интернета.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SurvivalCalc">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SurvivalCalc — Офлайн калькулятор походного рациона и снаряжения</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F1216;
      color: #F1F5F9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background-color: #0F1216;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #28343E;
      border-top: 3px solid #FF6B00;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 18px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div class="loading-text">Инициализация SurvivalCalc Engine...</div>
  </div>
  <script>
    function removeLoading() {
      var loadingIndicator = document.getElementById('loading-indicator');
      if (loadingIndicator) {
        loadingIndicator.style.opacity = '0';
        loadingIndicator.style.transition = 'opacity 0.25s ease-out';
        setTimeout(function () {
          if (loadingIndicator && loadingIndicator.parentNode) {
            loadingIndicator.parentNode.removeChild(loadingIndicator);
          }
        }, 250);
      }
    }
    window.addEventListener('flutter-first-frame', removeLoading);
    window.addEventListener('load', function () {
      var interval = setInterval(function () {
        if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
          removeLoading();
          clearInterval(interval);
        }
      }, 100);
      setTimeout(function () {
        removeLoading();
        clearInterval(interval);
      }, 3500);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
